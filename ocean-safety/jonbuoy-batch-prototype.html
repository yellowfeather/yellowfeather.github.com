<style type="text/tailwindcss">
@theme {
  --font-sans: Inter, sans-serif;
  --font-sans--font-feature-settings: 'cv11';
  --color-brand: #15375e;
}
[x-cloak] { display: none !important; }
body { background: var(--color-white); }
@media (prefers-color-scheme: dark) { body { background: var(--color-zinc-900); } }

/* Catalyst input (InputTagHelper) */
.c-input-wrap { @apply relative block w-full before:absolute before:inset-px before:rounded-[calc(var(--radius-lg)-1px)] before:bg-white before:shadow-sm dark:before:hidden after:pointer-events-none after:absolute after:inset-0 after:rounded-lg after:ring-transparent after:ring-inset sm:focus-within:after:ring-2 sm:focus-within:after:ring-blue-500 has-[:disabled]:opacity-50 has-[:disabled]:before:bg-zinc-950/5 has-[:disabled]:before:shadow-none; }
.c-input { @apply relative block w-full appearance-none rounded-lg px-[calc(--spacing(3.5)-1px)] py-[calc(--spacing(2.5)-1px)] sm:px-[calc(--spacing(3)-1px)] sm:py-[calc(--spacing(1.5)-1px)] text-base/6 text-zinc-950 placeholder:text-zinc-500 sm:text-sm/6 dark:text-white border border-zinc-950/10 hover:border-zinc-950/20 dark:border-white/10 dark:hover:border-white/20 bg-transparent dark:bg-white/5 focus:outline-hidden; }
.c-input.is-invalid { @apply border-red-500 hover:border-red-500 dark:border-red-500; }
.c-input-sm { @apply min-w-28 py-[calc(--spacing(1.5)-1px)] text-sm/6; }

/* Catalyst input group (InputGroupTagHelper) — trailing unit */
.c-group { @apply flex items-center rounded-md bg-white outline-1 -outline-offset-1 outline-gray-300 dark:bg-white/5 dark:outline-white/10 has-[input:focus-within]:outline-2 has-[input:focus-within]:-outline-offset-2 has-[input:focus-within]:outline-indigo-600 dark:has-[input:focus-within]:outline-indigo-500; }
.c-group.is-invalid { @apply outline-red-500; }
.c-group input { @apply block min-w-0 grow bg-transparent py-1.5 pr-3 pl-3 text-base text-gray-900 placeholder:text-gray-400 focus:outline-none sm:text-sm/6 dark:text-white dark:placeholder:text-gray-500; }
.c-group span { @apply shrink-0 pr-3 text-base text-gray-500 select-none sm:text-sm/6 dark:text-gray-400; }

/* Catalyst buttons (ButtonTagHelper) */
.c-btn { @apply relative isolate inline-flex items-center justify-center gap-x-2 rounded-lg border text-base/6 font-semibold px-[calc(--spacing(3.5)-1px)] py-[calc(--spacing(2.5)-1px)] sm:px-[calc(--spacing(3)-1px)] sm:py-[calc(--spacing(1.5)-1px)] sm:text-sm/6 focus:outline-2 focus:outline-offset-2 focus:outline-blue-500 disabled:opacity-50 cursor-pointer; }
.c-btn-outline { @apply border-zinc-950/10 text-zinc-950 hover:bg-zinc-950/2.5 dark:border-white/15 dark:text-white dark:hover:bg-white/5; }
.c-btn-plain { @apply border-transparent text-zinc-950 hover:bg-zinc-950/5 dark:text-white dark:hover:bg-white/10; }
.c-btn-solid { @apply border-transparent bg-(--btn-border) dark:bg-(--btn-bg) before:absolute before:inset-0 before:-z-10 before:rounded-[calc(var(--radius-lg)-1px)] before:bg-(--btn-bg) before:shadow-sm dark:before:hidden dark:border-white/5 after:absolute after:inset-0 after:-z-10 after:rounded-[calc(var(--radius-lg)-1px)] after:shadow-[inset_0_1px_--theme(--color-white/15%)] hover:after:bg-(--btn-hover-overlay) dark:after:-inset-px dark:after:rounded-lg; }
.c-btn-indigo { @apply text-white [--btn-hover-overlay:var(--color-white)]/10 [--btn-bg:var(--color-indigo-500)] [--btn-border:var(--color-indigo-600)]/90; }
.c-btn-xs { @apply px-2 py-1 sm:px-2 sm:py-0.5 text-sm/6 sm:text-xs/5 gap-x-1; }

/* Catalyst table (TableTagHelper) */
.c-table { @apply min-w-full text-left text-sm/6 text-zinc-950 dark:text-white; }
.c-table th { @apply border-b border-b-zinc-950/10 px-4 py-2 font-medium text-zinc-500 first:pl-2 last:pr-2 dark:border-b-white/10 dark:text-zinc-400 whitespace-nowrap; }
.c-table td { @apply relative px-4 py-2.5 first:pl-2 last:pr-2 align-middle; }
.c-table tbody tr { @apply even:bg-zinc-950/2.5 dark:even:bg-white/2.5; }

/* Catalyst checkbox / radio */
.c-check { @apply col-start-1 row-start-1 appearance-none rounded-sm border border-gray-300 bg-white checked:border-indigo-600 checked:bg-indigo-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:border-white/10 dark:bg-white/5 dark:checked:border-indigo-500 dark:checked:bg-indigo-500 size-4 cursor-pointer; }
.c-check:checked { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 14 14' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3 8L6 11L11 3.5' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-size: 100% 100%; }
.c-radio { @apply relative size-4 appearance-none rounded-full border border-gray-300 bg-white before:absolute before:inset-1 before:rounded-full before:bg-white not-checked:before:hidden checked:border-indigo-600 checked:bg-indigo-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:border-white/10 dark:bg-white/5 dark:checked:border-indigo-500 dark:checked:bg-indigo-500 cursor-pointer; }

.c-label { @apply text-base/6 text-zinc-950 select-none sm:text-sm/6 dark:text-white; }
.c-legend { @apply text-base/6 font-semibold text-zinc-950 sm:text-sm/6 dark:text-white; }
.c-text { @apply text-base/6 text-zinc-500 sm:text-sm/6 dark:text-zinc-400; }
.c-error { @apply mt-2 text-sm text-red-600 dark:text-red-500; }
.c-badge { @apply whitespace-nowrap inline-flex items-center gap-x-1.5 rounded-md px-1.5 py-0.5 text-sm/5 font-medium sm:text-xs/5; }
.c-badge-green { @apply bg-green-500/15 text-green-700 dark:bg-green-500/10 dark:text-green-400; }
.c-badge-red { @apply bg-red-500/15 text-red-700 dark:bg-red-500/10 dark:text-red-400; }
.c-badge-amber { @apply bg-amber-400/20 text-amber-700 dark:bg-amber-400/10 dark:text-amber-400; }
.c-badge-zinc { @apply bg-zinc-600/10 text-zinc-700 dark:bg-white/5 dark:text-zinc-400; }
.c-section { @apply grid grid-cols-1 gap-x-8 gap-y-10 md:grid-cols-3 border-b border-gray-900/10 pb-12 dark:border-white/10; }
.c-inputs { @apply grid max-w-2xl grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6 md:col-span-2; }
.c-tablebox { @apply mt-4 overflow-x-auto rounded-lg ring-1 ring-zinc-950/10 dark:ring-white/10; }
.c-sidebar-item { @apply relative flex w-full items-center gap-3 rounded-lg px-2 py-2.5 text-left text-base/6 font-medium sm:py-2 sm:text-sm/5 hover:bg-zinc-950/5 dark:hover:bg-white/5 text-zinc-950 dark:text-white; }
.varied { @apply bg-amber-400/15 dark:bg-amber-400/10; }
</style>

          </button>
          <button type="button" x-show="step === 4" class="c-btn c-btn-solid c-btn-indigo" @click="submit()">
            <svg class="size-5 text-indigo-200" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
            <span x-text="'Submit ' + units.length + (units.length === 1 ? ' record' : ' records')"></span>
          </button>
        </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Toast -->
  <div x-show="toast" x-cloak x-transition.opacity class="fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-lg bg-zinc-900 px-4 py-2.5 text-sm text-white shadow-lg dark:bg-zinc-700" x-text="toast"></div>
</div>

<script>
const today = () => new Date().toISOString().slice(0, 10);

function wizard() {
  return {
    nav: ['Customers', 'Categories', 'Manufacturers', 'Products', 'Manufacturer Records', 'Product Records', 'Service Records', 'Service Stations', 'Reports', 'Group Approvals', 'Product Registrations'],
    steps: ['Overview', 'Data Capture', 'Inspection / Testing', 'Approval / Sign off'],
    existing: ['EV01041'],
    dcFields: [
      { key: 'buoyancyRoll', label: 'Buoyancy Tube Roll Number', short: 'Buoyancy roll', group: 'Fabric Roll Numbers' },
      { key: 'floorRoll', label: 'Floor Roll Number', short: 'Floor roll', group: 'Fabric Roll Numbers' },
      { key: 'canopyRoll', label: 'Canopy Roll Number', short: 'Canopy roll', group: 'Fabric Roll Numbers' },
      { key: 'prvBatch', label: 'PRV Batch Number', short: 'PRV batch', group: 'Inflation System' },
      { key: 'topUpBatch', label: 'Top-up Valve Batch Number', short: 'Top-up valve batch', group: 'Inflation System' },
    ],
    ambientFields: [
      { key: 'tempOn', label: 'Ambient Temp ON', unit: '°C', step: '0.1' },
      { key: 'ambOn', label: 'Ambient Pressure ON', unit: 'mbar', step: '1' },
      { key: 'tempOff', label: 'Ambient Temp OFF', unit: '°C', step: '0.1' },
      { key: 'ambOff', label: 'Ambient Pressure OFF', unit: 'mbar', step: '1' },
    ],
    inspection: [
      { key: 'carcass', label: 'Carcass Seams, Glue & Stitching', desc: 'Carcass seam welding, grab handles, manifold welding, light & AIS patch, keel-to-floor, buckles & D-rings, pressure relief valve.' },
      { key: 'ladder', label: 'Boarding Ladder', desc: 'Secure, undamaged and correctly positioned.' },
      { key: 'arch', label: 'Arch & Canopy', desc: 'Arch inflates fully; canopy fitted and undamaged.' },
      { key: 'labelling', label: 'Labelling / Artwork', desc: 'All labels present, legible and correctly placed.' },
    ],

    step: 1, maxStep: 1, submitted: false, toast: '', toastTimer: null,
    attempted: {}, genError: '', serialsEdited: false, removed: [], nextId: 1,
    ov: {}, units: [], shared: {}, varies: {}, pt: {}, insp: {}, approval: {},

    init() { this.reset(); },

    reset() {
      Object.assign(this, {
        step: 1, maxStep: 1, submitted: false, attempted: {}, genError: '', serialsEdited: false, removed: [],
        ov: { date: today(), capacity: '', quantity: 1, start: '' },
        shared: { buoyancyRoll: '', floorRoll: '', canopyRoll: '', prvBatch: '', topUpBatch: '', tempOn: '', ambOn: '', tempOff: '', ambOff: '' },
        varies: { buoyancyRoll: false, floorRoll: false, canopyRoll: false, prvBatch: false, topUpBatch: false, ambient: false },
        pt: { testDate: today(), stretchOn: '', stretchOff: '', pressOn: '', pressOff: '' },
        insp: { carcass: false, ladder: false, arch: false, labelling: false },
        approval: { by: '', date: today() },
      });
      this.units = [this.newUnit('')];
      window.scrollTo({ top: 0 });
    },

    loadExample() {
      this.reset();
      Object.assign(this.ov, { capacity: '4', quantity: 10, start: 'EV01042' });
      this.generate();
      Object.assign(this.shared, { buoyancyRoll: 'R-5531', floorRoll: 'R-5540', canopyRoll: 'R-5562', prvBatch: 'PRV-2291', topUpBatch: 'TV-118', tempOn: '18.5', ambOn: '1012', tempOff: '18.0', ambOff: '1013' });
      this.varies.prvBatch = true;
      this.onVariesChange('prvBatch');
      this.units.forEach((u, i) => { if (i >= 7) u.vals.prvBatch = 'PRV-2307'; });
      Object.assign(this.pt, { stretchOn: '08:30', stretchOff: '09:05', pressOn: '09:15', pressOff: '10:15' });
      Object.assign(this.insp, { carcass: true, ladder: true, arch: true, labelling: true });
      const on = [210, 212, 209, 211, 210, 213, 208, 210, 211, 209];
      const off = [205, 208, 204, 207, 206, 209, 203, 206, 196, 205];
      this.units.forEach((u, i) => { u.topOn = String(on[i]); u.topOff = String(off[i]); });
      this.flash('Example: 10 EVACs, PRVs from two batches, carcass EV01050 fails its pressure test');
    },

    newUnit(serial) { return { id: this.nextId++, serial, vals: {}, topOn: '', topOff: '' }; },

    // ---- serial numbers ----
    increment(serial, by) {
      const m = (serial || '').trim().match(/^(.*?)(\d+)$/);
      if (!m) return null;
      return m[1] + String(parseInt(m[2], 10) + by).padStart(m[2].length, '0');
    },
    autoGenerate() { if (!this.serialsEdited) this.generate(); },
    regenerate() {
      if (confirm('Rebuild the list from the first serial number? Your edits to the list will be lost.')) { this.serialsEdited = false; this.generate(); }
    },
    generate() {
      const q = Math.min(Math.max(parseInt(this.ov.quantity) || 1, 1), 25);
      const start = (this.ov.start || '').trim();
      this.genError = '';
      if (start && this.increment(start, 0) === null) {
        this.genError = 'The serial number must end in a number to fill in the rest of the list, e.g. EV01042.';
        return;
      }
      const old = this.units;
      this.units = Array.from({ length: q }, (_, i) => {
        const u = old[i] || this.newUnit('');
        u.serial = start ? this.increment(start, i) : '';
        this.prefill(u);
        return u;
      });
    },
    addUnit() {
      const last = this.units[this.units.length - 1];
      const u = this.newUnit(last ? (this.increment(last.serial, 1) || '') : '');
      this.prefill(u);
      this.units.push(u);
      this.ov.quantity = this.units.length;
    },
    removeUnit(i) { this.units.splice(i, 1); this.ov.quantity = this.units.length; this.serialsEdited = true; },
    removeFromSet(u) {
      this.units = this.units.filter(x => x !== u);
      this.ov.quantity = this.units.length;
      if (u.serial) this.removed.push(u.serial);
      this.flash((u.serial || 'Carcass') + ' removed from this set and kept as a separate draft record');
    },
    serialError(u) {
      const s = (u.serial || '').trim();
      if (!s) return this.attempted[1] ? 'Serial number is required.' : '';
      if (this.units.filter(x => (x.serial || '').trim().toLowerCase() === s.toLowerCase()).length > 1) return 'Duplicate serial number in this set.';
      if (this.existing.includes(s.toUpperCase())) return 'Already registered as a manufacturer record.';
      return '';
    },

    // ---- shared vs per-unit values ----
    variesKey(key) { return ['tempOn', 'ambOn', 'tempOff', 'ambOff'].includes(key) ? 'ambient' : key; },
    keysFor(vk) { return vk === 'ambient' ? ['tempOn', 'ambOn', 'tempOff', 'ambOff'] : [vk]; },
    val(u, key) { return this.varies[this.variesKey(key)] ? u.vals[key] : this.shared[key]; },
    prefill(u) {
      Object.keys(this.varies).forEach(vk => {
        if (this.varies[vk]) this.keysFor(vk).forEach(k => { if (u.vals[k] === undefined) u.vals[k] = this.shared[k]; });
      });
    },
    onVariesChange(vk) {
      const keys = this.keysFor(vk);
      if (this.varies[vk]) {
        this.units.forEach(u => keys.forEach(k => { if (this.isBlank(u.vals[k])) u.vals[k] = this.shared[k]; }));
      } else {
        // Collapse back to one value: keep the first carcass's value as the shared value.
        keys.forEach(k => { if (this.units[0] && !this.isBlank(this.units[0].vals[k])) this.shared[k] = this.units[0].vals[k]; });
      }
    },
    dcVaried() { return this.dcFields.filter(f => this.varies[f.key]); },
    fillDown(i, key) {
      const v = this.units[i].vals[key];
      for (let j = i + 1; j < this.units.length; j++) this.units[j].vals[key] = v;
      this.flash('Copied "' + v + '" to carcasses ' + (i + 2) + '–' + this.units.length);
    },
    // A value is "odd" (highlighted on review) when it differs from the most common value in the set.
    isOdd(u, key) {
      if (!this.varies[this.variesKey(key)]) return false;
      const counts = {};
      this.units.forEach(x => { const v = x.vals[key] ?? ''; counts[v] = (counts[v] || 0) + 1; });
      const common = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
      return (u.vals[key] ?? '') !== common;
    },

    // ---- pressure test (formula from Features/Shared/_PressureTest.cshtml) ----
    isBlank(v) { return v === null || v === undefined || String(v).trim() === ''; },
    num(v) { return this.isBlank(v) || isNaN(+v) ? null : +v; },
    calc(u) {
      const tOn = this.num(this.val(u, 'tempOn')), tOff = this.num(this.val(u, 'tempOff'));
      const aOn = this.num(this.val(u, 'ambOn')), aOff = this.num(this.val(u, 'ambOff'));
      const top = this.num(u.topOn), topOff = this.num(u.topOff);
      if ([tOn, tOff, aOn, aOff, top, topOff].some(x => x === null)) return null;
      const c = topOff + (tOn - tOff) * 4 + (aOff - aOn);
      return { c, pass: c >= top * 0.95 && c <= top * 1.05 };
    },
    stretchMinutes() {
      if (!this.pt.stretchOn || !this.pt.stretchOff) return null;
      const m = t => { const [h, mm] = t.split(':').map(Number); return h * 60 + mm; };
      return m(this.pt.stretchOff) - m(this.pt.stretchOn);
    },

    // ---- validation ----
    bad(step, cond) { return !!this.attempted[step] && cond; },
    errors(step) {
      const e = [];
      if (step === 1) {
        if (!this.ov.date) e.push('Manufactured Date is required.');
        if (!this.ov.capacity) e.push('Capacity is required.');
        this.units.forEach((u, i) => { const m = this.serialError(u) || (!u.serial.trim() ? 'Serial number is required.' : ''); if (m) e.push('Carcass ' + (i + 1) + ': ' + m); });
      }
      if (step === 2) {
        this.dcFields.forEach(f => {
          if (!this.varies[f.key]) { if (this.isBlank(this.shared[f.key])) e.push(f.label + ' is required.'); }
          else this.units.forEach(u => { if (this.isBlank(u.vals[f.key])) e.push(u.serial + ': ' + f.label + ' is required.'); });
        });
      }
      if (step === 3) {
        this.inspection.forEach(c => { if (!this.insp[c.key]) e.push(c.label + ' must be confirmed.'); });
        if (!this.pt.stretchOn || !this.pt.stretchOff) e.push('Stretch times are required.');
        if (!this.pt.pressOn || !this.pt.pressOff) e.push('Pressure times are required.');
        if (!this.varies.ambient) this.ambientFields.forEach(a => { if (this.isBlank(this.shared[a.key])) e.push(a.label + ' is required.'); });
        this.units.forEach(u => {
          const missing = (this.varies.ambient ? ['tempOn', 'ambOn', 'tempOff', 'ambOff'].some(k => this.isBlank(u.vals[k])) : false) || this.isBlank(u.topOn) || this.isBlank(u.topOff);
          if (missing) e.push(u.serial + ': pressure readings are incomplete.');
        });
      }
      if (step === 4) {
        if (!this.approval.by) e.push('Approved by is required.');
        this.units.forEach(u => { const r = this.calc(u); if (r && !r.pass) e.push(u.serial + ' failed its pressure test. Go back to Inspection / Testing to retest it or remove it from this set.'); });
      }
      return e;
    },

    // ---- navigation ----
    goTo(n) { if (n <= this.maxStep) { this.step = n; window.scrollTo({ top: 0 }); } },
    next() {
      this.attempted[this.step] = true;
      if (this.errors(this.step).length) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      this.step++; this.maxStep = Math.max(this.maxStep, this.step);
      window.scrollTo({ top: 0 });
    },
    prev() { this.step--; window.scrollTo({ top: 0 }); },
    save() { this.flash('Draft saved for ' + this.units.length + (this.units.length === 1 ? ' carcass' : ' carcasses')); },
    submit() {
      this.attempted[4] = true;
      if (this.errors(4).length) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      this.submitted = true; window.scrollTo({ top: 0 });
    },

    flash(msg) { this.toast = msg; clearTimeout(this.toastTimer); this.toastTimer = setTimeout(() => this.toast = '', 3500); },
    fmtDate(d) { if (!d) return ''; const [y, m, dd] = d.split('-'); return dd + '/' + m + '/' + y; },
  };
}
</script>
</body>
